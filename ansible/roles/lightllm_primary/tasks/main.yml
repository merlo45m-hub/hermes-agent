---
# Tasks for the lightllm_primary role: install, configure, and activate the
# hot-standby-ready primary gateway.

- name: Ensure python3 + pip + virtualenv tooling are present
  ansible.builtin.apt:
    name: ["python3", "python3-pip", "python3-venv", "virtualenv"]
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install LightLLM into a dedicated virtualenv
  ansible.builtin.pip:
    name: "lightllm"
    virtualenv: "{{ lightllm_virtualenv }}"
    virtualenv_site_packages: false
    exec_path: "{{ lightllm_virtualenv }}/bin/pip"
    extra_args: "{{ lightllm_primary_pip_extra_args | default(omit) }}"

- name: Write the primary LightLLM config
  ansible.builtin.template:
    src: lightllm-primary.yaml.j2
    dest: "{{ lightllm_config_dir }}/primary.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Write the primary systemd unit
  ansible.builtin.template:
    src: lightllm-primary.service.j2
    dest: "/etc/systemd/system/{{ lightllm_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: restart lightllm primary

- name: Ensure the primary service is started and enabled
  ansible.builtin.systemd:
    name: "{{ lightllm_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
