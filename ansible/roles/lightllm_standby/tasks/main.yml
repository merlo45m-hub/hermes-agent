---
# Tasks for the lightllm_standby role: install, configure, and activate a
# hot-standby gateway that is promoted when the primary is unreachable.

- name: Ensure python3 + pip + virtualenv tooling are present
  ansible.builtin.apt:
    name: ["python3", "python3-pip", "python3-venv", "virtualenv"]
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install LightLLM into the shared virtualenv
  ansible.builtin.pip:
    name: "lightllm"
    virtualenv: "{{ lightllm_virtualenv }}"
    virtualenv_site_packages: false
    exec_path: "{{ lightllm_virtualenv }}/bin/pip"
    extra_args: "{{ lightllm_standby_pip_extra_args | default(omit) }}"

- name: Write the standby LightLLM config
  ansible.builtin.template:
    src: lightllm-standby.yaml.j2
    dest: "{{ lightllm_config_dir }}/standby.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Write the standby systemd unit
  ansible.builtin.template:
    src: lightllm-standby.service.j2
    dest: "/etc/systemd/system/{{ lightllm_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: restart lightllm standby

- name: Ensure the standby service is started and enabled
  ansible.builtin.systemd:
    name: "{{ lightllm_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
