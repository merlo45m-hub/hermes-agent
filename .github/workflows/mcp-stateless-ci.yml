name: MCP Stateless Meta Test

on:
  pull_request:
    paths:
      - tools/mcp_tool_handlers.py
      - tests/tools/test_mcp_stateless_meta.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stateless-meta:
    name: MCP stateless meta pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and pytest
        run: python -m pip install -e . pytest psutil ruamel.yaml
      - name: Run focused negative-control tests
        run: python -m pytest tests/tools/test_mcp_stateless_meta.py -q
