name: MCP MRTR Test

on:
  push:
    branches: [feat/mcp2-mrtr]
    paths:
      - tools/mcp_tool_handlers.py
      - tests/tools/test_mcp_mrtr.py
      - tests/tools/test_mcp_stateless_meta.py
      - .github/workflows/mcp-mrtr-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mrtr:
    name: MCP MRTR pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest psutil ruamel.yaml mcp
      - name: Run MRTR and stateless meta negative controls
        run: python -m pytest tests/tools/test_mcp_mrtr.py tests/tools/test_mcp_stateless_meta.py -q
