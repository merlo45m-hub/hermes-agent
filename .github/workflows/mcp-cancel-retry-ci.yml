name: MCP MRTR Cancel Retry Test

on:
  push:
    branches: [feat/mcp2-cancel-retry]
    paths:
      - tools/mcp_tool_handlers.py
      - tests/tools/test_mcp_mrtr_cancel_retry.py
      - tests/tools/test_mcp_mrtr.py
      - tests/tools/test_mcp_stateless_meta.py
      - .github/workflows/mcp-cancel-retry-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: MCP MRTR cancel/retry pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest psutil ruamel.yaml mcp
      - name: Run MRTR cancel/retry tests
        run: python -m pytest tests/tools/test_mcp_mrtr_cancel_retry.py tests/tools/test_mcp_mrtr.py tests/tools/test_mcp_stateless_meta.py -q
