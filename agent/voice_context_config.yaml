    - ATTACK
    - JUMP
    - SPRINT
    - MOVE
    - SWITCH_WEAPON
    - USE_SPECIAL
    - EAT_FOOD
    - INTERACT
    - RELOAD
  general:
    aliases: {}
    confidence_threshold: 0.6
    suggested_actions:
      DEFAULT:
      - help
      - summary
      - next
    valid_commands: []
  terminal:
    aliases: {}
    confidence_threshold: 0.7
    suggested_actions:
      DEFAULT:
      - status
      - build
      - run
      - logs
    valid_commands: []
