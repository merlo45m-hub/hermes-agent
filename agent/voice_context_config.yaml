engine:
  articulate_mode: always
  include_context: true
  memory_mode: first_turn
  # Which profile each ENTRY POINT uses. There is no single "active" profile:
  # the two hooks set their own, explicitly, so the behaviour never depends on
  # which order things ran in.
  typed_profile: general      # pre_llm_call  -> typed chat text
  voice_profile: game         # pre_tool_call -> voice / game tool commands
  cache_max_entries: 1000
# Engine default. Equals typed_profile; the voice hook switches to voice_profile
# explicitly before it processes, so this default only covers typed text.
default_profile: general
profiles:
  game:
    aliases:
      9mm: pistol
      aid: medkit
      ak: rifle
      ammunition: ammo
      ar: rifle
      assault: rifle
      assault rifle: rifle
      bandage: medkit
      baseball: bat
      baseball bat: bat
      batteries: battery
      beam sword: lightsaber
      blade: knife
      boomstick: shotgun
      borger: burger
      bullets: ammo
      cappuccino: coffee
      cheeseburger: burger
      chips: fries
      club: bat
      cola: soda
      crisps: takis
      dagger: knife
      doughnut: donut
      drink: soda
      espresso: coffee
      fire axe: axe
      fire gun: firegun
      first aid: medkit
      fist: fists
      flame gun: firegun
      flamethrower: firegun
      french fries: fries
      glock: pistol
      gun: pistol
      hamburger: burger
      hand: fists
      handgun: pistol
      hands: fists
      hatchet: axe
      health pack: medkit
      laser sword: lightsaber
      latte: coffee
