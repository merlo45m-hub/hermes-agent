    confidence_threshold: 0.65
    suggested_actions:
      ATTACK:
      - RELOAD
      - SWITCH_WEAPON
      - SPRINT
      DEFAULT:
      - ATTACK
      - SWITCH_WEAPON
      - RELOAD
      - JUMP
      - SPRINT
      EAT_FOOD:
      - ATTACK
      - SPRINT
      MOVE:
      - ATTACK
      - JUMP
      - SPRINT
      SWITCH_WEAPON:
      - ATTACK
      - RELOAD
